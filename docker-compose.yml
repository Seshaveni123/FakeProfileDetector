services:
  legacy-backend:
    profiles: ["legacy"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fakeguard-legacy-backend
    ports:
      - "8003:8000"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fakeguard
      POSTGRES_USER: fakeguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fakeguard}
    volumes:
      - fakeguard-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fakeguard -d fakeguard"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  history-service:
    build:
      context: .
      dockerfile: services/history-service/Dockerfile
    container_name: fakeguard-history
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://fakeguard:${POSTGRES_PASSWORD:-fakeguard}@postgres:5432/fakeguard
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  prediction-service:
    build:
      context: .
      dockerfile: services/prediction-service/Dockerfile
    container_name: fakeguard-prediction
    ports:
      - "8000:8000"
    environment:
      HISTORY_SERVICE_URL: http://history-service:8001
    depends_on:
      history-service:
        condition: service_healthy
    restart: unless-stopped

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    container_name: fakeguard-analytics
    ports:
      - "8002:8002"
    environment:
      HISTORY_SERVICE_URL: http://history-service:8001
    depends_on:
      history-service:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fakeguard-frontend
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      prediction-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      history-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  fakeguard-postgres-data:

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fakeguard-ingress
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 5173
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fakeguard-api-ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /api/(predict(?:/.*)?|model-info)
        pathType: ImplementationSpecific
        backend:
          service:
            name: prediction-service
            port:
              number: 8000
      - path: /api/(history(?:/.*)?|records(?:/.*)?)
        pathType: ImplementationSpecific
        backend:
          service:
            name: history-service
            port:
              number: 8001
      - path: /api/(dashboard)
        pathType: ImplementationSpecific
        backend:
          service:
            name: analytics-service
            port:
              number: 8002

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fakeguard-backend
  namespace: default
  labels:
    release: monitoring
    app: backend
spec:
  selector:
    matchLabels:
      app: backend
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
    scrapeTimeout: 10s
---
